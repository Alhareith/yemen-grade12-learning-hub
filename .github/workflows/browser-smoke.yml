name: Browser smoke test

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "refine/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vercel-style static output
        run: GITHUB_ACTIONS=false pnpm build

      - name: Install isolated browser driver for smoke verification
        run: |
          mkdir -p /tmp/yemen-grade12-browser-smoke
          cd /tmp/yemen-grade12-browser-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core

      - name: Start production preview
        run: |
          GITHUB_ACTIONS=false pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/yemen-grade12-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/yemen-grade12-preview.log
          exit 1

      - name: Verify mobile prompts, curriculum, skill practice and both math models
        run: |
          cd /tmp/yemen-grade12-browser-smoke
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { chromium } from "playwright-core";

          const baseUrl = "http://127.0.0.1:4173/";
          const promptEvidencePath = `${process.env.GITHUB_WORKSPACE}/prompt-mobile-smoke.png`;
          const curriculumEvidencePath = `${process.env.GITHUB_WORKSPACE}/curriculum-smoke.png`;
          const practiceEvidencePath = `${process.env.GITHUB_WORKSPACE}/skill-practice-smoke.png`;
          const exam1EvidencePath = `${process.env.GITHUB_WORKSPACE}/exam-model-1-smoke.png`;
          const exam2EvidencePath = `${process.env.GITHUB_WORKSPACE}/exam-model-2-smoke.png`;
          const localFailures = [];
          const pageErrors = [];
          const consoleErrors = [];

          const browser = await chromium.launch({ executablePath: "/usr/bin/google-chrome", headless: true, args: ["--no-sandbox", "--disable-dev-shm-usage"] });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          page.on("requestfailed", (request) => {
            if (request.url().startsWith(baseUrl)) localFailures.push(`${request.url()} :: ${request.failure()?.errorText ?? "failed"}`);
          });
          page.on("pageerror", (error) => pageErrors.push(error.message));
          page.on("console", (message) => { if (message.type() === "error") consoleErrors.push(message.text()); });

          await page.goto(baseUrl, { waitUntil: "domcontentloaded" });
          await page.getByText("دليل الثالث", { exact: false }).first().waitFor();
          assert.equal(await page.locator("html").getAttribute("dir"), "rtl");

          assert.equal(await page.getByText("من نحن", { exact: true }).count(), 1, "Expected footer heading");
          assert.equal(await page.getByText("GitHub", { exact: true }).count(), 0, "GitHub footer link should be removed");
          assert.equal(await page.getByText("Hugging Face", { exact: true }).count(), 0, "Hugging Face footer link should be removed");

          assert.equal(await page.locator("[data-app-header]").count(), 1, "Expected exactly one application header");
          assert.equal(await page.getByRole("button", { name: "أوامر", exact: true }).count(), 0, "Legacy mobile tabs should be removed from the shell");

          const mobileNav = page.locator(".v3-mobile-bottom-nav");
          await mobileNav.waitFor();
          assert.equal(await mobileNav.getByRole("button").count(), 5, "Expected five frozen mobile destinations");
          for (const label of ["الرئيسية", "المنهج", "التدريب", "مولد الأوامر", "المزيد"]) {
            assert.equal(await mobileNav.getByRole("button", { name: label, exact: true }).count(), 1, `Expected mobile destination: ${label}`);
          }
          assert.equal(await mobileNav.getByRole("button", { name: "الرئيسية", exact: true }).getAttribute("aria-current"), "page");

          const mobileSlot = page.locator("[data-app-shell-mobile]");
          const mobileSpacer = page.locator("[data-app-shell-mobile-spacer]");
          const navBox = await mobileNav.boundingBox();
          const slotBox = await mobileSlot.boundingBox();
          const spacerBox = await mobileSpacer.boundingBox();
          assert.ok(navBox && slotBox && spacerBox, "Expected measurable mobile navigation geometry");
          assert.ok(navBox.height >= 64, `Expected mobile nav height >= 64px, got ${navBox.height}`);
          assert.ok(spacerBox.height >= slotBox.height, "Expected flow spacer to reserve the fixed navigation height");
          assert.ok(Math.abs((slotBox.y + slotBox.height) - 844) <= 1, "Expected mobile navigation to be fixed to viewport bottom");

          await mobileNav.getByRole("button", { name: "مولد الأوامر", exact: true }).click();
          await page.getByRole("heading", { name: "أوامر اسأل بها أي ذكاء اصطناعي متوفر لديك" }).waitFor();
          assert.equal(new URL(page.url()).hash, "#prompts");
          assert.equal(await mobileNav.getByRole("button", { name: "مولد الأوامر", exact: true }).getAttribute("aria-current"), "page");
          assert.equal(await page.evaluate(() => document.activeElement?.id), "app-content", "Route transition should focus the application content");
          assert.equal(await page.getByText("لا تحتاج كتابة اسم الدرس.", { exact: true }).count(), 0, "Old lesson-name notice should be removed");
          assert.equal(await page.getByText("الرياضيات مضبوطة بالعربي.", { exact: true }).count(), 0, "Old math notice should be removed");

          await page.getByText("اشرح الدرس من الصفر", { exact: true }).click();
          await page.locator("[data-generated-prompt]").waitFor();
          const generatedPrompt = await page.locator("[data-generated-prompt]").innerText();
          assert.ok(generatedPrompt.includes("تنسيق العرض مثل الكتاب المدرسي"), "Expected school-book formatting policy in copied command");
          assert.ok(generatedPrompt.includes("اختر طريقة الشرح التي تناسبك"), "Expected depth-choice policy in copied command");
          assert.ok(generatedPrompt.includes("١. مرة واحدة"), "Expected one-response option");
          assert.ok(generatedPrompt.includes("٢. خطوة بخطوة بعمق أكبر"), "Expected deep step-by-step option");
          assert.ok(generatedPrompt.includes("٣. خطوات قليلة مكتملة ومتدرجة"), "Expected grouped-steps option");
          assert.ok(generatedPrompt.includes("٤. شرح مركز ثم مثال"), "Expected focused-example option");
          assert.ok(generatedPrompt.includes("إذا كان المطلوب صغيرًا أو مباشرًا"), "Expected direct response rule for small topics");
          await page.screenshot({ path: promptEvidencePath, fullPage: false });

          await page.evaluate(() => window.scrollTo(0, 500));
          await page.emulateMedia({ reducedMotion: "reduce" });
          await page.evaluate(() => {
            window.__routeScrollBehavior = null;
            const originalScrollTo = window.scrollTo.bind(window);
            window.scrollTo = (...args) => {
              const first = args[0];
              if (first && typeof first === "object") {
                window.__routeScrollBehavior = first.behavior ?? null;
              }
              return originalScrollTo(...args);
            };
          });

          await mobileNav.getByRole("button", { name: "المزيد", exact: true }).click();
          await page.getByRole("heading", { name: "مصادر رياضيات" }).waitFor();
          assert.equal(new URL(page.url()).hash, "#resources");
          assert.equal(await mobileNav.getByRole("button", { name: "المزيد", exact: true }).getAttribute("aria-current"), "page");
          assert.equal(await page.evaluate(() => document.activeElement?.id), "app-content", "Reduced-motion route transition should keep focus lifecycle");
          assert.equal(await page.evaluate(() => window.__routeScrollBehavior), "auto", "Reduced motion should disable smooth route scrolling");
          assert.ok(Math.abs(await page.evaluate(() => window.scrollY)) <= 1, "Route lifecycle should reset scroll to top");
          await page.emulateMedia({ reducedMotion: "no-preference" });

          await page.setViewportSize({ width: 900, height: 900 });
          assert.equal(await mobileNav.isVisible(), false, "Mobile navigation must be hidden at 900px");
          assert.equal(await mobileSpacer.isVisible(), false, "Mobile navigation spacer must be hidden at 900px");
          await page.setViewportSize({ width: 390, height: 844 });

          await mobileNav.getByRole("button", { name: "التدريب", exact: true }).click();
          await page.locator("[data-curriculum-explorer]").waitFor();
          assert.equal(new URL(page.url()).hash, "#curriculum", "Training without practice context should resolve to curriculum");
          assert.equal(await mobileNav.getByRole("button", { name: "المنهج", exact: true }).getAttribute("aria-current"), "page");

          const curriculumHashBeforeSkip = new URL(page.url()).hash;
          const skipLink = page.getByRole("link", { name: "تجاوز إلى المحتوى" });
          await skipLink.focus();
          await skipLink.press("Enter");
          assert.equal(new URL(page.url()).hash, curriculumHashBeforeSkip, "Skip link must not mutate the Hash Router");
          assert.equal(await page.evaluate(() => document.activeElement?.id), "app-content", "Skip link should focus app content");

          await page.locator("[data-curriculum-explorer]").waitFor();
          const skillCount = await page.locator("[data-curriculum-skill]").count();
          assert.ok(skillCount > 0, "Expected visible curriculum skills");
          await page.locator("[data-skill-detail]").waitFor();
          await page.locator("[data-skill-prompt-action]").waitFor();
          await page.locator("[data-skill-practice-action]").waitFor();
          assert.equal(await page.locator("[data-skill-detail]").getByText("برومبتات", { exact: true }).count(), 0, "Skill metric dashboard should be removed");
          assert.equal(await page.getByText("اختبر هذه المهارة داخل المحاكاة", { exact: true }).count(), 0, "Per-skill general exam action should remain removed");
          assert.equal(await page.getByText("CPLX-NUMBER-USE", { exact: true }).count(), 0, "Technical skill id should not be student-visible");
          assert.ok((await page.locator("[data-skill-prompt-action]").innerText()).includes("انسخ الأمر واسأل به أي ذكاء اصطناعي"));
          assert.ok((await page.locator("[data-skill-practice-action]").innerText()).includes("تدرّب على هذه المهارة"));
          await page.screenshot({ path: curriculumEvidencePath, fullPage: false });

          await page.locator("[data-skill-practice-action]").click();
          await page.locator("[data-practice-page]").waitFor();
          assert.equal(await mobileNav.getByRole("button", { name: "التدريب", exact: true }).getAttribute("aria-current"), "page");
          await page.getByText("فهم وتمثيل العدد المركب", { exact: false }).first().waitFor();
          await page.locator("[data-practice-start]").click();

          const answerRound = async () => {
            const ids = [];
            for (let index = 0; index < 5; index += 1) {
              const card = page.locator("[data-practice-question]");
              await card.waitFor();
              const questionId = await card.getAttribute("data-question-id");
              assert.ok(questionId, "Practice question should expose a stable id for smoke verification");
              ids.push(questionId);
              await page.locator("[data-practice-option]").first().click();
              await page.locator("[data-practice-feedback]").waitFor();
              await page.locator("[data-practice-next]").click();
            }
            await page.locator("[data-practice-round-result]").waitFor();
            return ids;
          };

          const firstRoundIds = await answerRound();
          assert.equal(new Set(firstRoundIds).size, 5, "First practice round should contain five unique questions");
          await page.locator("[data-practice-diagnostic]").waitFor();
          const deepeningButton = page.locator("[data-practice-deepening-prompt]");
          await deepeningButton.waitFor();
          assert.ok((await deepeningButton.innerText()).includes("تعميق الفهم بناءً على نتيجتك"), "Expected result-based deepening prompt action for lesson 01");
          await page.locator("[data-practice-next-round]").click();
          const secondRoundIds = await answerRound();
          assert.equal(new Set(secondRoundIds).size, 5, "Second practice round should contain five unique questions");
          assert.deepEqual(firstRoundIds.filter((id) => secondRoundIds.includes(id)), [], "Second practice round must not repeat first-round questions");
          await page.getByText("أكملت جولتين دون تكرار مباشر", { exact: true }).waitFor();
          await page.locator("[data-practice-diagnostic]").waitFor();
          await page.locator("[data-practice-deepening-prompt]").waitFor();
          await page.screenshot({ path: practiceEvidencePath, fullPage: false });

          await page.goto(`${baseUrl}#exam-pilot`, { waitUntil: "domcontentloaded" });
          await page.locator("[data-arabic-exam]").waitFor();
          await page.locator("[data-exam-model-selector]").waitFor();
          assert.equal(await page.locator("[data-app-shell]").count(), 0, "ExamPilot must bypass the production AppShell");
          assert.equal(await page.locator("[data-app-header]").count(), 0, "ExamPilot must not inherit the product header");
          assert.equal(await page.locator(".v3-mobile-bottom-nav").count(), 0, "ExamPilot must not inherit the product mobile navigation");
          const modelCards = page.locator("[data-exam-model]");
          assert.equal(await modelCards.count(), 2, "Expected exactly two math model cards");
          await page.getByText("النموذج العام ١", { exact: false }).waitFor();
          await page.getByText("النموذج العام ٢", { exact: false }).waitFor();

          await page.locator('[data-exam-model="MATH-CALC-2020-ADAPTED-PILOT-01"]').click();
          await page.getByRole("button", { name: "بدون مؤقت" }).click();
          await page.getByRole("button", { name: "ابدأ المحاكاة" }).click();
          await page.getByText(/السؤال\s+[١1]\s+من\s+[٥5][٠0]/).waitFor();

          await page.locator("[data-arabic-exam] math").first().waitFor();
          await page.locator("[data-arabic-exam] .arabic-math-wrap").first().waitFor();
          const mathCount1 = await page.locator("[data-arabic-exam] math").count();
          const enhancedMathCount1 = await page.locator("[data-arabic-exam] .arabic-math-wrap").count();
          assert.ok(mathCount1 > 0, "Expected MathML in protected model 1 question");
          assert.ok(enhancedMathCount1 > 0, "Expected Arabic math enhancement in model 1");
          await page.screenshot({ path: exam1EvidencePath, fullPage: false });

          const model1StorageKey = "yemen-grade12:exam-session:v2:MATH-CALC-2020-ADAPTED-PILOT-01";
          await page.waitForFunction(
            (key) => window.localStorage.getItem(key) !== null,
            model1StorageKey,
          );
          await page.reload({ waitUntil: "domcontentloaded" });
          await page.locator("[data-exam-model-selector]").waitFor();
          assert.equal(await page.locator("[data-app-shell]").count(), 0, "Reloaded ExamPilot must remain outside AppShell");
          await page.locator('[data-exam-model="MATH-CALC-2020-ADAPTED-PILOT-01"]').click();
          await page.getByText("محاولة محفوظة على هذا الجهاز", { exact: true }).waitFor();
          assert.equal(await page.locator("[data-app-shell]").count(), 0, "Recovered ExamPilot session must remain outside AppShell");
          await page.getByRole("button", { name: "متابعة المحاولة", exact: true }).click();
          await page.getByText(/السؤال\s+[١1]\s+من\s+[٥5][٠0]/).waitFor();

          await page.getByRole("button", { name: "كل النماذج" }).click();
          await page.locator('[data-exam-model="MATH-AGP-GENERAL-MODEL-02"]').click();
          await page.getByText("الجبر والهندسة والاحتمالات", { exact: false }).first().waitFor();
          await page.getByRole("button", { name: "بدون مؤقت" }).click();
          await page.getByRole("button", { name: "ابدأ المحاكاة" }).click();
          await page.getByText(/السؤال\s+[١1]\s+من\s+[٥5][٠0]/).waitFor();
          const model2OptionCount = await page.getByRole("button", { name: /صح|خطأ/ }).count();
          assert.ok(model2OptionCount >= 2, `Expected true/false options in model 2, got ${model2OptionCount}`);
          assert.equal(await page.locator("[data-arabic-exam]").getAttribute("dir"), "rtl");
          assert.equal(await page.locator("[data-arabic-exam]").getAttribute("lang"), "ar");
          await page.screenshot({ path: exam2EvidencePath, fullPage: false });

          assert.deepEqual(localFailures, [], `Local asset failures: ${localFailures.join(" | ")}`);
          assert.deepEqual(pageErrors, [], `Page errors: ${pageErrors.join(" | ")}`);
          assert.deepEqual(consoleErrors, [], `Console errors: ${consoleErrors.join(" | ")}`);

          console.log(JSON.stringify({ home: true, singleAppHeader: true, legacyMobileTabsRemoved: true, mobileNavFiveItems: true, mobileNavSafeSpacing: true, mobileNavHiddenAt900: true, trainingResolver: true, mobileNavRouteActiveStates: true, routeFocusLifecycle: true, reducedMotionRouteScroll: true, skipLinkRouterSafe: true, promptRoute: true, resourcesRoute: true, promptPolicy: true, footerClean: true, curriculumRoute: true, skillCount, practiceRoute: true, practiceDiagnostics: true, practiceDeepeningPrompt: true, practiceRound1: firstRoundIds, practiceRound2: secondRoundIds, noPracticeRepeat: true, modelCards: 2, examShellBypass: true, examSessionRecovery: true, model1FirstQuestion: true, model2FirstQuestion: true, mathCount1, enhancedMathCount1, model2OptionCount, rtl: true }, null, 2));
          await browser.close();
          NODE

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: |
            prompt-mobile-smoke.png
            curriculum-smoke.png
            skill-practice-smoke.png
            exam-model-1-smoke.png
            exam-model-2-smoke.png
          if-no-files-found: ignore
          retention-days: 14