name: V3 generate font lock

on:
  push:
    branches:
      - "feature/v3-design-system"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[font-lock-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Generate exact Fontsource dependency lock
        run: pnpm add @fontsource/ibm-plex-sans-arabic@5.3.0 --save-exact
      - name: Upload generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: v3-font-lock-manifests
          path: |
            package.json
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
