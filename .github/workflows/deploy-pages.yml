name: نشر موقع دليل الثالث على GitHub Pages

on:
  push:
    branches:
      - main
      - arena/01a0694f-yemen-grade12-learning-hub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل المصدر
        uses: actions/checkout@v4
      - name: إعداد pnpm
        uses: pnpm/action-setup@v4
      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: تثبيت الحزم
        run: pnpm install --frozen-lockfile
      - name: بناء الموقع
        run: pnpm build
      - name: تجهيز ملفات Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
