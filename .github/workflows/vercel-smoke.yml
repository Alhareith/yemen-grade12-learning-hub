name: Verify Vercel production

on:
  push:
    branches:
      - test/vercel-production-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Vercel public aliases
        run: |
          set -euo pipefail
          for url in \
            https://yemen-grade12-learning-hub-alhareith.vercel.app/ \
            https://yemen-grade12-learning-hub.vercel.app/
          do
            echo "=== $url ==="
            echo "INITIAL_HEADERS"
            curl -sSI "$url" | sed -n '1,12p'
            echo "FOLLOWED"
            curl -sS -L -o body.html -w 'FINAL_STATUS=%{http_code}\nFINAL_URL=%{url_effective}\n' "$url"
            echo "BODY_PREVIEW"
            head -c 500 body.html || true
            echo
            echo "BODY_TEXT_HINTS"
            grep -oE 'دليل الثالث|Log In|Login|Sign In|Vercel|NOT_FOUND|Authentication' body.html | head -20 || true
            echo
          done
