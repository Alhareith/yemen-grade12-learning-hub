name: Verify Vercel production

on:
  push:
    branches:
      - test/vercel-production-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Vercel home, lazy chunks, and exam route
        env:
          BASE_URL: https://yemen-grade12-learning-hub-alhareith.vercel.app/
        run: |
          set -euo pipefail

          status="$(curl -sS -L -o home.html -w '%{http_code}' "$BASE_URL")"
          echo "HOME_STATUS=$status"
          echo "HOME_PREVIEW_START"
          head -c 500 home.html || true
          echo
          echo "HOME_PREVIEW_END"
          test "$status" = "200"
          grep -q 'دليل الثالث' home.html

          main_js="$(grep -oE '<script[^>]+src="/assets/[^"]+\.js"' home.html | head -1 | sed -E 's/.*src="([^"]+)".*/\1/')"
          echo "MAIN_JS=$main_js"
          test -n "$main_js"
          curl -fsSL "${BASE_URL%/}${main_js}" -o main.js

          exam_chunk="$(grep -oE 'ExamPilot-[A-Za-z0-9_-]+\.js' main.js | head -1)"
          arabic_chunk="$(grep -oE 'ArabicExamTypography-[A-Za-z0-9_-]+\.js' main.js | head -1)"
          echo "EXAM_CHUNK=$exam_chunk"
          echo "ARABIC_CHUNK=$arabic_chunk"
          test -n "$exam_chunk"
          test -n "$arabic_chunk"

          curl -fsSIL "${BASE_URL}assets/${exam_chunk}" >/dev/null
          curl -fsSIL "${BASE_URL}assets/${arabic_chunk}" >/dev/null

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=12000 \
            --dump-dom \
            "${BASE_URL}#exam-pilot" > exam.html 2>chrome.log

          grep -q 'data-arabic-exam' exam.html
          grep -q 'التفاضل والتكامل' exam.html

          echo "EXAM_ROUTE_OK=true"
