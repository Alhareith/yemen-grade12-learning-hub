name: Verify Vercel production

on:
  push:
    branches:
      - test/vercel-production-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify production and lazy exam route
        env:
          BASE_URL: https://yemen-grade12-learning-hub-alhareith.vercel.app/
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();

          const responses = [];
          const consoleErrors = [];
          const pageErrors = [];

          page.on('response', response => {
            responses.push({ url: response.url(), status: response.status() });
          });
          page.on('console', message => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });
          page.on('pageerror', error => pageErrors.push(String(error)));

          const home = await page.goto(base, { waitUntil: 'networkidle', timeout: 60000 });
          if (!home || home.status() !== 200) {
            throw new Error(`Home returned ${home?.status() ?? 'no response'}`);
          }

          const title = await page.title();
          if (!title.includes('دليل الثالث')) {
            throw new Error(`Unexpected title: ${title}`);
          }

          const initialScripts = new Set(
            responses
              .filter(r => r.status < 400 && /\.js(?:\?|$)/.test(r.url))
              .map(r => r.url)
          );

          responses.length = 0;
          await page.goto(`${base}#exam-pilot`, { waitUntil: 'networkidle', timeout: 60000 });
          await page.waitForSelector('[data-arabic-exam]', { timeout: 30000 });

          const examText = await page.locator('[data-arabic-exam]').innerText();
          if (!examText.includes('التفاضل والتكامل')) {
            throw new Error('Exam route loaded but expected calculus content was not found');
          }

          const failedAssets = responses.filter(
            r => r.status >= 400 && /\.(?:js|css)(?:\?|$)/.test(r.url)
          );
          if (failedAssets.length) {
            throw new Error(`Failed JS/CSS assets: ${JSON.stringify(failedAssets)}`);
          }

          const routeScripts = responses
            .filter(r => r.status < 400 && /\.js(?:\?|$)/.test(r.url))
            .map(r => r.url);
          const lazyScripts = routeScripts.filter(url => !initialScripts.has(url));
          if (lazyScripts.length === 0) {
            throw new Error(`No lazy JS chunk loaded for #exam-pilot. Route scripts: ${JSON.stringify(routeScripts)}`);
          }

          if (pageErrors.length) {
            throw new Error(`Page errors: ${JSON.stringify(pageErrors)}`);
          }

          console.log(`HOME_STATUS=${home.status()}`);
          console.log(`TITLE=${title}`);
          console.log(`EXAM_ROUTE_OK=true`);
          console.log(`LAZY_CHUNKS=${JSON.stringify(lazyScripts)}`);
          console.log(`CONSOLE_ERRORS=${JSON.stringify(consoleErrors)}`);

          await browser.close();
          EOF
